apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: ghcr.io/acme/web:latest
          envFrom:
            - configMapRef: {name: web-config}
          volumeMounts:
            - {name: secret, mountPath: /etc/secret}
      volumes:
        - name: secret
          secret: {secretName: web-secret}
