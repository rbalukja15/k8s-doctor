name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cache pinned tools
        uses: actions/cache@v4
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}
      - name: Lint
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cache pinned tools and Kubernetes schemas
        uses: actions/cache@v4
        with:
          path: |
            bin
            .cache/schemas
          key: tools-schemas-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}
      - name: Install kustomize and kubeconform, fetch schemas
        run: make tools schemas
      - name: Test
        run: make test
      - name: Build
        run: make build
