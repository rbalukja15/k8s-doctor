apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: {kind: Deployment}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: any
      spec:
        template:
          spec:
            nodeSelector:
              node-pool.example.com/name: shop
            tolerations:
              - {key: dedicated, operator: Equal, value: shop, effect: NoSchedule}
