apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs: {app.kubernetes.io/name: webshop}
    includeSelectors: false
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pdb.yaml
configMapGenerator:
  - name: webshop-config
    literals:
      - LOG_LEVEL=info
      - CATALOG_SERVICE_URL=http://catalog:8080
      - PUBLIC_HOST=placeholder
configurations:
  - kustomizeconfig.yaml
