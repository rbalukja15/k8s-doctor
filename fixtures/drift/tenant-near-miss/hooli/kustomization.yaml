# A prod tenant that differs from acme only in ways the default presets
# expect: more replicas, a newer image tag, bigger resources, its own host.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: webshop-hooli
namePrefix: hooli-
resources:
  - ../../../e2e/gitops/deployables/webshop/overlays/prod/common
  - sealedsecret.yaml
components:
  - ../../../e2e/gitops/components/ip-whitelist
images:
  - name: registry.example.com/shop/webshop
    newTag: 1.8.1
replicas:
  - name: webshop
    count: 4
patches:
  - target: {kind: Deployment, name: webshop}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 500m, memory: 512Mi}
          limits: {memory: 1Gi}
  - target: {kind: Ingress, name: webshop}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: hooli.webshop.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: hooli.webshop.example.com
replacements:
  - source: {kind: Ingress, name: webshop, fieldPath: spec.rules.0.host}
    targets:
      - select: {kind: ConfigMap, name: webshop-config}
        fieldPaths: [data.PUBLIC_HOST]
  - source: {kind: KongPlugin, name: ip-whitelist, fieldPath: metadata.name}
    targets:
      - select: {kind: Ingress, name: webshop}
        fieldPaths: ["metadata.annotations.[konghq.com/plugins]"]
