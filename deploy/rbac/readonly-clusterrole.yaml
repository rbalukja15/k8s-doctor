# Read-only access for `k8s-doctor --cluster`.
#
# Only get, list and watch, on exactly the resources the collector reads
# (internal/collector/cluster.go RequiredResources; a test keeps the two in
# sync). Secrets and ConfigMaps need list because the collector lists them
# through the metadata API: it requests PartialObjectMetadata, so values are
# never sent. Note that list on secrets would still let this identity read
# values with another client, so bind it only to k8s-doctor.
#
#   kubectl apply -f deploy/rbac/readonly-clusterrole.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-doctor
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-doctor
  namespace: k8s-doctor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-doctor-readonly
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, services, events, configmaps, secrets]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-doctor-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-doctor-readonly
subjects:
  - kind: ServiceAccount
    name: k8s-doctor
    namespace: k8s-doctor
